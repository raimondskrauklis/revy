# .github/workflows/release-tag.yml
# Create a GitHub Release when version or program baseline tags are pushed.
name: Release tag

on:
  push:
    tags:
      - "saas-base-v*"
      - "review-r*-v*"
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Existing tag to publish as a GitHub Release"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name, '-alpha') || contains(github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name, '-beta') || contains(github.event_name == 'workflow_dispatch' && inputs.tag_name || github.ref_name, '-rc') }}
