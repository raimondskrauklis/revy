# backend/alembic.ini
# Database URL is set in alembic/env.py from app settings (not in this file).
# Revisions: hand-written only — no --autogenerate.
#
# Filename pattern (KP): YYYY_MM_DD_HHMM_NNNN_slug.py
# Example: 2025_11_17_1522_0001_uuid_v7_base_setup.py
# rev_id is the full stem; file_template below writes rev_id.py unchanged.

[alembic]
script_location = alembic
prepend_sys_path = .
version_path_separator = os
sqlalchemy.url =
revision_environment = true
file_template = %%(rev)s
timezone = UTC

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
