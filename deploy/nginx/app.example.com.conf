# deploy/nginx/app.example.com.conf
# Install: /etc/nginx/sites-available/app.example.com
# Enable:  ln -sf /etc/nginx/sites-available/app.example.com /etc/nginx/sites-enabled/
#
# Domain:        app.example.com
# Public API:    https://app.example.com/api/v1
# Public SPA:    https://app.example.com/
# Keycloak:      https://auth.example.com (separate vhost)
#
# TLS (DNS-01, no port 80): docs/utils/CERTBOT_DNS_RENEWAL.md
#   cert-name:   app.example.com
#   SAN:         app.example.com, auth.example.com
#
# Upstreams (Docker on droplet, host-published):
#   revy-api  → 127.0.0.1:8000
#   revy-web  → 127.0.0.1:5173
#
# Prerequisite: deploy/nginx/nginx-http.snippet in nginx.conf http {}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name app.example.com;

    ssl_certificate     /etc/letsencrypt/live/app.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.example.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 320m;

    add_header Strict-Transport-Security "max-age=63072000; includeSubdomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    large_client_header_buffers 4 32k;
    proxy_buffer_size       16k;
    proxy_buffers           16 16k;
    proxy_busy_buffers_size 32k;

    gzip            on;
    gzip_types      application/json text/plain text/css application/javascript;
    gzip_min_length 1024;
    gzip_vary       on;

    location = /silent-check-sso.html {
        default_type text/html;
        add_header Cache-Control "public, max-age=300";
        return 200 '<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Silent Check SSO</title>
</head>
<body>
<script>
  try {
    if (parent && parent !== window) {
      parent.postMessage(location.href, location.origin || "*");
    }
  } catch (e) {}
</script>
</body>
</html>';
    }

    location = /silent-check-sso {
        default_type text/html;
        add_header Cache-Control "public, max-age=300";
        return 200 '<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Silent Check SSO</title>
</head>
<body>
<script>
  try {
    if (parent && parent !== window) {
      parent.postMessage(location.href, location.origin || "*");
    }
  } catch (e) {}
</script>
</body>
</html>';
    }

    location /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        limit_req_status 429;
        limit_req_log_level warn;

        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:5173;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;

        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "upgrade";

        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
